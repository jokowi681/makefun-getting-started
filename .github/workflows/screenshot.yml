name: screenshot
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download repository screenshot
        run: curl -L --fail -o screenshot.png "https://image.thum.io/get/width/1280/crop/900/https://github.com/jokowi681/makefun-getting-started"
      - name: Verify screenshot
        run: file screenshot.png && ls -lh screenshot.png
      - name: Commit screenshot and remove this workflow
        run: |
          git config user.name "jokowi681"
          git config user.email "jokowi681@users.noreply.github.com"
          rm .github/workflows/screenshot.yml
          git add screenshot.png
          git add -A .github/workflows/screenshot.yml
          git commit -m "Add screenshot.png" || exit 0
          git push
